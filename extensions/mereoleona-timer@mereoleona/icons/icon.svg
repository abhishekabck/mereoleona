<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1500"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </radialGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e8650e"/>
      <stop offset="60%" stop-color="#f2a81e"/>
      <stop offset="100%" stop-color="#ffdd77"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- clock face -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#fire)" stroke-width="2.5"/>
  <!-- hour hand (pointing ~1 o'clock) -->
  <line x1="32" y1="32" x2="38" y2="20" stroke="url(#fire)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- minute hand (pointing ~6 o'clock) -->
  <line x1="32" y1="32" x2="32" y2="44" stroke="#ffdd77" stroke-width="1.8" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="2" fill="#f2a81e"/>
  <!-- flame tick marks (12, 3, 6, 9) -->
  <line x1="32" y1="15" x2="32" y2="18" stroke="#e8650e" stroke-width="2" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="46" y2="32" stroke="#e8650e" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="32" y2="46" stroke="#e8650e" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="32" x2="18" y2="32" stroke="#e8650e" stroke-width="2" stroke-linecap="round"/>
</svg>
