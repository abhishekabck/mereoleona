<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="45%" stop-color="#ffd66b"/>
      <stop offset="100%" stop-color="#c8341e"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="64" cy="64" r="62"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="64" fill="#1e0d00"/>
  <g clip-path="url(#clip)">
    <!-- eighth notes -->
    <ellipse cx="42" cy="90" rx="14" ry="10" fill="url(#fire)"/>
    <rect x="54" y="28" width="8" height="64" fill="url(#fire)"/>
    <ellipse cx="86" cy="76" rx="13" ry="9" fill="url(#fire)"/>
    <rect x="77" y="28" width="8" height="50" fill="url(#fire)"/>
    <!-- beam connecting the two notes -->
    <rect x="54" y="28" width="31" height="9" rx="3" fill="url(#fire)"/>
  </g>
</svg>
