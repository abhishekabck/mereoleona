<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="45%" stop-color="#ffd66b"/>
      <stop offset="100%" stop-color="#c8341e"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="64" cy="64" r="62"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="64" fill="#1e0d00"/>
  <g clip-path="url(#clip)">
    <!-- pin head (circle) -->
    <circle cx="64" cy="44" r="22" fill="url(#fire)"/>
    <!-- pin body -->
    <rect x="58" y="62" width="12" height="28" rx="4" fill="url(#fire)"/>
    <!-- pin point -->
    <line x1="64" y1="90" x2="64" y2="106" stroke="#ffd66b" stroke-width="7" stroke-linecap="round"/>
    <!-- inner highlight -->
    <circle cx="58" cy="38" r="6" fill="rgba(255,246,230,0.35)"/>
  </g>
</svg>
