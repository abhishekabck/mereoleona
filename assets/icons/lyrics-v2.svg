<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="45%" stop-color="#ffd66b"/>
      <stop offset="100%" stop-color="#c8341e"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="64" cy="64" r="62"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="64" fill="#1e0d00"/>
  <g clip-path="url(#clip)">
    <!-- microphone body -->
    <rect x="50" y="20" width="28" height="52" rx="14" fill="url(#fire)"/>
    <!-- stand arc -->
    <path d="M36 64 Q36 96 64 96 Q92 96 92 64"
          fill="none" stroke="url(#fire)" stroke-width="8" stroke-linecap="round"/>
    <!-- stand post -->
    <line x1="64" y1="96" x2="64" y2="112" stroke="url(#fire)" stroke-width="8" stroke-linecap="round"/>
    <!-- base -->
    <line x1="44" y1="112" x2="84" y2="112" stroke="url(#fire)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
