    <rect x="36" y="46" width="16" height="72" rx="5" fill="url(#fire)"/>
    <rect x="58" y="22" width="16" height="96" rx="5" fill="url(#fire)"/>
    <rect x="80" y="52" width="16" height="66" rx="5" fill="url(#fire)"/>
    <rect x="102" y="66" width="16" height="52" rx="5" fill="url(#fire)"/>
